<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="اختر تصميم ورق الحائط، أدخل مقاس الحائط، واعرف السعر مع الشحن المجاني من X LINE">
  <title>X LINE | ورق حائط حسب المقاس">

  <style>
    :root {
      --blue: #55b9ff;
      --bg: #080b12;
      --card: #111722;
      --card2: #161e2b;
      --text: #f7fbff;
      --muted: #aeb8c7;
      --line: rgba(255,255,255,.1);
      --green: #65df9e;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 85px; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 78% 8%, rgba(64,155,255,.13), transparent 25rem),
        radial-gradient(circle at 15% 32%, rgba(64,155,255,.07), transparent 20rem),
        var(--bg);
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { color: inherit; }

    .container { width: min(1180px, calc(100% - 32px)); margin-inline: auto; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(8,11,18,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      color: #06101c;
      background: linear-gradient(135deg, #72caff, #278fff);
      box-shadow: 0 10px 30px rgba(67,176,255,.22);
      transform: skewX(-8deg);
    }

    .brand-mark span { transform: skewX(8deg); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover { color: var(--blue); }
    .nav-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      cursor: pointer;
      transition: .25s;
    }

    .icon-btn:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      color: var(--blue);
    }

    .hero {
      min-height: 560px;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      align-items: center;
      gap: 42px;
      padding-block: 60px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 9px 13px;
      margin-bottom: 18px;
      color: var(--blue);
      background: rgba(85,185,255,.08);
      border: 1px solid rgba(85,185,255,.18);
      border-radius: 999px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .blue-text {
      background: linear-gradient(135deg, #9bdcff, #3197ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      max-width: 580px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.85;
    }

    .price-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 24px 0;
    }

    .price-line strong { font-size: 32px; }
    .price-line span { color: var(--muted); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; }

    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border: 0;
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      color: #06101c;
      background: linear-gradient(135deg, #72caff, #278fff);
      box-shadow: 0 12px 32px rgba(39,143,255,.2);
    }

    .btn-primary:hover { box-shadow: 0 16px 38px rgba(39,143,255,.32); }
    .btn-secondary { background: var(--card); border: 1px solid var(--line); }

    .hero-image {
      position: relative;
      height: 420px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 28px 75px rgba(0,0,0,.4);
    }

    .hero-image img { width: 100%; height: 100%; object-fit: cover; }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 45% 0 0;
      background: linear-gradient(transparent, rgba(0,0,0,.72));
    }

    .hero-badge {
      position: absolute;
      z-index: 1;
      right: 18px;
      bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(8,11,18,.82);
      backdrop-filter: blur(10px);
    }

    .hero-badge small { display: block; color: var(--muted); margin-bottom: 4px; }

    .section { padding-block: 58px; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 25px;
    }

    .section-head h2 {
      margin: 0 0 7px;
      font-size: clamp(29px, 4vw, 42px);
    }

    .section-head p { margin: 0; color: var(--muted); line-height: 1.7; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .category-card {
      position: relative;
      display: block;
      height: 190px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      transition: .3s ease;
    }

    .category-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s;
    }

    .category-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 20%, rgba(3,6,10,.88));
    }

    .category-card span {
      position: absolute;
      z-index: 1;
      right: 15px;
      bottom: 14px;
      font-size: 18px;
      font-weight: 900;
    }

    .category-card:hover {
      transform: translateY(-6px);
      border-color: rgba(85,185,255,.65);
      box-shadow: 0 18px 38px rgba(0,0,0,.25);
    }

    .category-card:hover img { transform: scale(1.08); }

    .category-page {
      min-height: 70vh;
      padding-block: 42px 72px;
    }

    .category-page-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .category-page h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: 0;
    }

    .category-page-intro { margin: 0; color: var(--muted); line-height: 1.7; }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }

    .back-link:hover { border-color: var(--blue); color: var(--blue); }

    .catalog-panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(17,23,34,.78);
    }

    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .catalog-toolbar h2 { margin: 0 0 5px; font-size: 23px; }
    .catalog-toolbar p { margin: 0; color: var(--muted); font-size: 14px; }

    .search-input {
      width: min(300px, 100%);
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: #0b1018;
    }

    .search-input:focus { border-color: var(--blue); }

    .products {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
      transition: .3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: rgba(85,185,255,.48);
      box-shadow: 0 18px 42px rgba(0,0,0,.25);
    }

    .product-image {
      position: relative;
      height: 220px;
      overflow: hidden;
      background: var(--card2);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s;
    }

    .product-card:hover .product-image img { transform: scale(1.06); }
    .product-info { padding: 13px; }
    .product-info h3 { margin: 0 0 12px; font-size: 16px; }

    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .product-price { color: var(--blue); font-weight: 900; font-size: 14px; }

    .select-design {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 11px;
      border: 1px solid rgba(85,185,255,.28);
      border-radius: 10px;
      color: var(--blue);
      background: rgba(85,185,255,.08);
      cursor: pointer;
    }

    .select-design:hover { color: #06101c; background: var(--blue); }
    .empty-state { grid-column: 1 / -1; color: var(--muted); padding: 28px; text-align: center; }

    .calculator {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(17,23,34,.96), rgba(13,18,27,.96));
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--text);
      background: #0b1018;
    }

    .field input:focus { border-color: var(--blue); }

    .upload-box {
      min-height: 130px;
      display: grid;
      place-items: center;
      margin-top: 14px;
      padding: 18px;
      border: 1px dashed rgba(85,185,255,.42);
      border-radius: 14px;
      color: var(--muted);
      background: rgba(85,185,255,.04);
      text-align: center;
      cursor: pointer;
    }

    .upload-box input { display: none; }
    .upload-preview { display: none; width: 100%; max-height: 220px; margin-top: 12px; border-radius: 12px; object-fit: cover; }

    .summary {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #0a0e15;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .summary-row strong { color: var(--text); text-align: left; }
    .summary-row.total { align-items: center; border: 0; color: var(--text); font-size: 18px; font-weight: 900; }
    .summary-row.total strong { color: var(--blue); font-size: 24px; }

    .discount-note {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      color: var(--green);
      background: rgba(101,223,158,.08);
    }

    .selected-design { margin-top: 13px; color: var(--muted); font-size: 14px; }
    .selected-design strong { color: var(--blue); }

    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; }
    .step { padding: 19px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .step-number {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      margin-bottom: 13px;
      border-radius: 11px;
      color: var(--blue);
      background: rgba(85,185,255,.12);
      font-weight: 900;
    }
    .step h3 { margin: 0 0 8px; }
    .step p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .faq { display: grid; grid-template-columns: .8fr 1.2fr; gap: 24px; }
    .faq-intro p { color: var(--muted); line-height: 1.8; }
    details { margin-bottom: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--card); }
    summary { padding: 16px; cursor: pointer; font-weight: 800; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; float: left; color: var(--blue); font-size: 20px; }
    details[open] summary::after { content: "−"; }
    details p { margin: 0; padding: 0 16px 16px; color: var(--muted); line-height: 1.8; }

    .cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-block: 25px 55px;
      padding: 28px;
      border: 1px solid rgba(85,185,255,.2);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(85,185,255,.15), rgba(29,92,160,.07)), var(--card);
    }

    .cta h2 { margin: 0 0 7px; }
    .cta p { margin: 0; color: var(--muted); }
    footer { padding: 25px 0; border-top: 1px solid var(--line); color: var(--muted); }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .whatsapp {
      position: fixed;
      z-index: 30;
      left: 18px;
      bottom: 18px;
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      color: #fff;
      background: #20c86a;
      font-size: 24px;
      box-shadow: 0 12px 32px rgba(32,200,106,.3);
    }

    .toast {
      position: fixed;
      z-index: 50;
      top: 88px;
      right: 20px;
      max-width: min(360px, calc(100% - 40px));
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: .25s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .modal {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(7px);
    }

    .modal.open { display: grid; }

    .modal-card {
      width: min(760px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #111722;
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
    }

    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; }
    .close-btn { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: #0a0e15; cursor: pointer; }
    .guide-list { display: grid; gap: 12px; }
    .guide-step { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: #0c111a; }
    .guide-step h3 { margin: 0 0 7px; color: var(--blue); }
    .guide-step p { margin: 0; color: var(--muted); line-height: 1.8; }
    .guide-warning { margin-top: 14px; padding: 13px; border-radius: 12px; color: #ffdb9c; background: rgba(255,190,75,.09); line-height: 1.7; }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 17px; }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .hero { grid-template-columns: 1fr; padding-block: 42px; }
      .hero-image { height: 360px; }
      .category-grid { grid-template-columns: repeat(3, 1fr); }
      .products { grid-template-columns: repeat(3, 1fr); }
      .calculator { grid-template-columns: 1fr; }
      .steps { grid-template-columns: repeat(2, 1fr); }
      .faq { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 24px, 1180px); }
      .nav-inner { min-height: 66px; }
      .brand { font-size: 18px; }
      .brand-mark { width: 38px; height: 38px; }
      .hero { gap: 25px; padding-block: 34px; }
      h1 { font-size: 44px; }
      .hero p { font-size: 15px; }
      .hero-image { height: 270px; border-radius: 19px; }
      .hero-actions .btn { flex: 1; }
      .section { padding-block: 44px; }
      .section-head { align-items: start; flex-direction: column; }
      .category-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .category-card { height: 145px; }
      .catalog-panel { padding: 13px; }
      .catalog-toolbar { align-items: stretch; flex-direction: column; }
      .search-input { width: 100%; }
      .products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .product-image { height: 165px; }
      .product-info { padding: 10px; }
      .product-info h3 { font-size: 14px; }
      .product-row { align-items: stretch; flex-direction: column; }
      .select-design { width: 100%; }
      .form-grid { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr; }
      .cta, .footer-inner, .category-page-top { align-items: stretch; flex-direction: column; }
      .cta .btn { width: 100%; }
      .whatsapp { width: 52px; height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media print {
      body * { visibility: hidden !important; }
      #guideModal, #guideModal * { visibility: visible !important; }
      #guideModal { position: absolute; inset: 0; display: block !important; padding: 0; background: white; color: black; }
      #guideModal .modal-card { width: 100%; max-height: none; overflow: visible; border: 0; box-shadow: none; background: white; color: black; }
      #guideModal .guide-step, #guideModal .guide-warning { color: black; background: white; border: 1px solid #999; }
      #guideModal .guide-step p, #guideModal .guide-warning { color: black; }
      #guideModal .modal-actions, #guideModal .close-btn { display: none !important; }
    }
  </style>
</head>

<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="./" aria-label="X LINE الرئيسية">
        <span class="brand-mark"><span>X</span></span>
        <span>X LINE</span>
      </a>

      <nav class="nav-links" aria-label="القائمة الرئيسية">
        <a href="./#categories">الأصناف</a>
        <a href="./#calculator">احسب مقاسك</a>
        <a href="./#installation">التركيب</a>
        <a href="./#faq">الأسئلة الشائعة</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="searchFocusBtn" title="البحث عن تصميم" aria-label="البحث عن تصميم">⌕</button>
        <button class="icon-btn" id="guideOpenBtn" title="كتالوج التركيب" aria-label="كتالوج التركيب">▤</button>
      </div>
    </div>
  </header>

  <main id="homeView">
    <section class="container hero">
      <div>
        <div class="eyebrow">◆ طباعة خاصة حسب المقاس</div>
        <h1>حوّل حائطك إلى <span class="blue-text">لوحة فنية</span></h1>
        <p>اختَر الصنف الذي يناسبك، تصفح تصميماته، وأدخل مقاس الحائط بالسنتيمتر لمعرفة السعر مباشرة.</p>
        <div class="price-line"><strong>450 جنيه</strong><span>للمتر المربع — الشحن مجاني</span></div>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#categories">اختَر الصنف ←</a>
          <a class="btn btn-secondary" href="#calculator">احسب السعر</a>
        </div>
      </div>

      <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=1400&q=85" alt="غرفة بتصميم داخلي أنيق">
        <div class="hero-badge"><small>خصم 5٪</small><strong>للطلبات الأكبر من 5 م²</strong></div>
      </div>
    </section>

    <section class="section" id="categories">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>اختَر الصنف</h2>
            <p>اضغط على صورة الصنف لفتح صفحة فيها كل تصميماته.</p>
          </div>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
      </div>
    </section>

    <section class="section" id="calculator">
      <div class="container">
        <div class="section-head">

    document.getElementById("guideCloseBtn").addEventListener("click", closeGuide);
    document.getElementById("printGuideBtn").addEventListener("click", () => window.print());

    guideModal.addEventListener("click", event => {
      if (event.target === guideModal) closeGuide();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeGuide();
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
