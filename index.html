<script>
  const WHATSAPP = "201208887256";
  const PRICE_PER_SQM = 450;
  const DISCOUNT_THRESHOLD = 5;
  const DISCOUNT_RATE = 0.05;

  const photo = (id, width = 850) =>
    `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=82`;

  const categories = [
    {
      id: "interior-panels",
      name: "Interior Panels",
      description: "بانلز حائط بمظهر مرتب ومعاصر",
      image: "photo-1618221195710-dd6b41faaea6"
    },
    {
      id: "calligraphy",
      name: "Calligraphy",
      description: "تصميمات خط عربي وديكور شرقي",
      image: "photo-1600607687939-ce8a6c25118c"
    },
    {
      id: "kids",
      name: "Kids",
      description: "تصميمات مرحة لغرف الأطفال",
      image: "photo-1616486338812-3dadae4b4ace"
    },
    {
      id: "mural",
      name: "Mural",
      description: "مشاهد كبيرة تغيّر إحساس المساحة",
      image: "photo-1470252649378-9c29740c9fa8"
    },
    {
      id: "leaves",
      name: "Leaves",
      description: "أوراق استوائية وطبيعة هادئة",
      image: "photo-1497250681960-ef046c08a56e"
    },
    {
      id: "concrete",
      name: "Concrete",
      description: "ستايل مودرن خام وبسيط",
      image: "photo-1600607687920-4e2a09cf159d"
    },
    {
      id: "wood",
      name: "Wood",
      description: "دفء ومظهر الخشب الطبيعي",
      image: "photo-1600566753086-00f18fb6b3ea"
    },
    {
      id: "marble",
      name: "Marble",
      description: "رخام أنيق بلمسة فاخرة",
      image: "photo-1600210492486-724fe5c67fb0"
    }
  ];

  const products = [
    /* Interior Panels */
    { name: "Velour", category: "interior-panels", image: "photo-1618221195710-dd6b41faaea6" },
    { name: "Bravura", category: "interior-panels", image: "photo-1600607687939-ce8a6c25118c" },
    { name: "Celestia", category: "interior-panels", image: "photo-1600210492486-724fe5c67fb0" },
    { name: "Ornamenta", category: "interior-panels", image: "photo-1600607687920-4e2a09cf159d" },
    { name: "Walnera", category: "interior-panels", image: "photo-1600566753086-00f18fb6b3ea" },

    /* Calligraphy */
    { name: "خط عربي ذهبي", category: "calligraphy", image: "photo-1600607687939-ce8a6c25118c" },
    { name: "نقوش شرقية", category: "calligraphy", image: "photo-1600210492486-724fe5c67fb0" },
    { name: "لمسة عربية", category: "calligraphy", image: "photo-1616486338812-3dadae4b4ace" },
    { name: "زخرفة كلاسيكية", category: "calligraphy", image: "photo-1600607687920-4e2a09cf159d" },
    { name: "فن شرقي أنيق", category: "calligraphy", image: "photo-1600566753086-00f18fb6b3ea" },

    /* Kids */
    { name: "عالم النجوم", category: "kids", image: "photo-1534796636912-3b95b3ab5986" },
    { name: "مغامرات الفضاء", category: "kids", image: "photo-1446776811953-b23d57bd21aa" },
    { name: "غابة الأحلام", category: "kids", image: "photo-1441974231531-c6227db76b6e" },
    { name: "ألوان مرحة", category: "kids", image: "photo-1549490349-8643362247b5" },
    { name: "سماء بنفسجية", category: "kids", image: "photo-1470770841072-f978cf4d019e" },

    /* Mural */
    { name: "غروب الجبال", category: "mural", image: "photo-1470252649378-9c29740c9fa8" },
    { name: "وادي الطبيعة", category: "mural", image: "photo-1500530855697-b586d89ba3ee" },
    { name: "قمم وضباب", category: "mural", image: "photo-1464822759023-fed622ff2c3b" },
    { name: "غابة استوائية", category: "mural", image: "photo-1441974231531-c6227db76b6e" },
    { name: "شلال هادئ", category: "mural", image: "photo-1433086966358-54859d0ed716" },

    /* Leaves */
    { name: "أوراق استوائية", category: "leaves", image: "photo-1497250681960-ef046c08a56e" },
    { name: "نباتات خضراء", category: "leaves", image: "photo-1501004318641-b39e6451bec6" },
    { name: "أغصان طبيعية", category: "leaves", image: "photo-1487530811176-3780de880c2d" },
    { name: "حديقة هادئة", category: "leaves", image: "photo-1490750967868-88aa4486c946" },
    { name: "لمسات نباتية", category: "leaves", image: "photo-1441974231531-c6227db76b6e" },

    /* Concrete */
    { name: "خرسانة ناعمة", category: "concrete", image: "photo-1600607687920-4e2a09cf159d" },
    { name: "ملمس رمادي", category: "concrete", image: "photo-1600607687939-ce8a6c25118c" },
    { name: "ستايل صناعي", category: "concrete", image: "photo-1600210492486-724fe5c67fb0" },
    { name: "خرسانة عصرية", category: "concrete", image: "photo-1618221195710-dd6b41faaea6" },
    { name: "رمادي أنيق", category: "concrete", image: "photo-1600566753086-00f18fb6b3ea" },

    /* Wood */
    { name: "خشب طبيعي", category: "wood", image: "photo-1600566753086-00f18fb6b3ea" },
    { name: "ألواح خشبية", category: "wood", image: "photo-1600607687920-4e2a09cf159d" },
    { name: "خشب دافئ", category: "wood", image: "photo-1600210492486-724fe5c67fb0" },
    { name: "خطوط خشبية", category: "wood", image: "photo-1618221195710-dd6b41faaea6" },
    { name: "خشب عصري", category: "wood", image: "photo-1600607687939-ce8a6c25118c" },

    /* Marble */
    { name: "رخام أبيض", category: "marble", image: "photo-1600210492486-724fe5c67fb0" },
    { name: "رخام بعروق ذهبية", category: "marble", image: "photo-1600607687939-ce8a6c25118c" },
    { name: "رخام رمادي", category: "marble", image: "photo-1600607687920-4e2a09cf159d" },
    { name: "رخام فاخر", category: "marble", image: "photo-1600566753086-00f18fb6b3ea" },
    { name: "رخام هادئ", category: "marble", image: "photo-1616486338812-3dadae4b4ace" }
  ];

  const categoryGrid = document.getElementById("categoryGrid");
  const productsContainer = document.getElementById("products");
  const catalogTitle = document.getElementById("catalogTitle");
  const catalogDescription = document.getElementById("catalogDescription");
  const searchInput = document.getElementById("designSearch");
  const selectedDesignElement = document.getElementById("selectedDesign");

  let activeCategory = "all";
  let selectedDesign = "";

  function renderCategories() {
    categoryGrid.innerHTML = categories.map(category => `
      <button class="category-card" type="button" data-category="${category.id}" aria-label="عرض تصاميم ${category.name}">
        <img src="${photo(category.image, 600)}" alt="${category.name}" loading="lazy">
        <span>
          ${category.name}
          <small style="display:block;margin-top:5px;font-size:12px;font-weight:400;opacity:.85">
            ${category.description}
          </small>
        </span>
      </button>
    `).join("");

    categoryGrid.querySelectorAll(".category-card").forEach(card => {
      card.addEventListener("click", () => selectCategory(card.dataset.category));
    });
  }

  function renderProducts() {
    const term = searchInput.value.trim().toLowerCase();

    const visibleProducts = products.filter(product => {
      const matchesCategory =
        activeCategory === "all" || product.category === activeCategory;
      const matchesSearch = product.name.toLowerCase().includes(term);
      return matchesCategory && matchesSearch;
    });

    if (!visibleProducts.length) {
      productsContainer.innerHTML =
        '<div class="empty-state">لا توجد تصاميم مطابقة. جرّب البحث بكلمة أخرى.</div>';
      return;
    }

    productsContainer.innerHTML = visibleProducts.map(product => `
      <article class="product-card">
        <div class="product-image">
          <img src="${photo(product.image)}" alt="${product.name}" loading="lazy">
        </div>
        <div class="product-info">
          <h4>${product.name}</h4>
          <div class="product-row">
            <span class="product-price">450 جنيه / م²</span>
            <button class="select-design" type="button" data-name="${product.name}">
              اختيار التصميم
            </button>
          </div>
        </div>
      </article>
    `).join("");

    productsContainer.querySelectorAll(".select-design").forEach(button => {
      button.addEventListener("click", () => {
        selectedDesign = button.dataset.name;
        selectedDesignElement.textContent = selectedDesign;
        showToast("تم اختيار: " + selectedDesign);
        document.getElementById("calculator").scrollIntoView({ behavior: "smooth" });
      });
    });
  }

  function selectCategory(categoryId) {
    activeCategory = categoryId;
    const category = categories.find(item => item.id === categoryId);

    catalogTitle.textContent = category ? category.name : "كل التصاميم";
    catalogDescription.textContent = category
      ? `تصفح تصاميم ${category.name} واختر التصميم المناسب لك.`
      : "اختر من التصاميم المتاحة في جميع الأصناف.";

    searchInput.value = "";
    renderProducts();
    document.getElementById("catalog").scrollIntoView({ behavior: "smooth" });
  }

  function formatMoney(value) {
    return value.toLocaleString("ar-EG", { maximumFractionDigits: 2 }) + " جنيه";
  }

  function updateCalculator() {
    const width = Math.max(0, Number(document.getElementById("width").value) || 0);
    const height = Math.max(0, Number(document.getElementById("height").value) || 0);
    const area = (width * height) / 10000;
    const subtotal = area * PRICE_PER_SQM;
    const discount = area > DISCOUNT_THRESHOLD ? subtotal * DISCOUNT_RATE : 0;
    const total = subtotal - discount;

    document.getElementById("area").textContent = area.toFixed(2) + " م²";
    document.getElementById("subtotal").textContent = formatMoney(subtotal);
    document.getElementById("discount").textContent = formatMoney(discount);
    document.getElementById("total").textContent = formatMoney(total);
    document.getElementById("discountNote").style.display =
      discount > 0 ? "block" : "none";
  }

  document.getElementById("width").addEventListener("input", updateCalculator);
  document.getElementById("height").addEventListener("input", updateCalculator);
  updateCalculator();

  document.getElementById("roomImage").addEventListener("change", function () {
    const file = this.files && this.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      showToast("من فضلك اختر ملف صورة.");
      this.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = event => {
      const preview = document.getElementById("uploadPreview");
      preview.src = event.target.result;
      preview.style.display = "block";
      showToast("تم عرض صورة المعاينة على جهازك.");
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("orderBtn").addEventListener("click", () => {
    const width = Number(document.getElementById("width").value) || 0;
    const height = Number(document.getElementById("height").value) || 0;

    if (width <= 0 || height <= 0) {
      showToast("أدخل عرض وارتفاع الحائط أولًا.");
      return;
    }

    const area = (width * height) / 10000;
    const subtotal = area * PRICE_PER_SQM;
    const discount = area > DISCOUNT_THRESHOLD ? subtotal * DISCOUNT_RATE : 0;
    const total = subtotal - discount;

    const message = [
      "مرحبًا X LINE، أريد الاستفسار عن طلب ورق حائط:",
      "التصنيف: " + (categories.find(item => item.id === activeCategory)?.name || "غير محدد"),
      "التصميم: " + (selectedDesign || "تصميم خاص / لم أختَر تصميمًا بعد"),
      "العرض: " + width + " سم",
      "الارتفاع: " + height + " سم",
      "المساحة: " + area.toFixed(2) + " م²",
      "السعر قبل الخصم: " + subtotal.toFixed(2) + " جنيه",
      "الخصم: " + discount.toFixed(2) + " جنيه",
      "الإجمالي: " + total.toFixed(2) + " جنيه",
      "أرجو توضيح طريقة الدفع وتأكيد الطلب."
    ].join("\n");

    window.open(
      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`,
      "_blank",
      "noopener"
    );
  });

  searchInput.addEventListener("input", renderProducts);

  document.getElementById("searchFocusBtn").addEventListener("click", () => {
    document.getElementById("catalog").scrollIntoView({ behavior: "smooth" });
    setTimeout(() => searchInput.focus(), 450);
  });

  const guideModal = document.getElementById("guideModal");

  function openGuide() {
    guideModal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeGuide() {
    guideModal.classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("guideOpenBtn").addEventListener("click", openGuide);
  document.getElementById("guideOpenBtn2").addEventListener("click", openGuide);
  document.getElementById("guideCloseBtn").addEventListener("click", closeGuide);

  guideModal.addEventListener("click", event => {
    if (event.target === guideModal) closeGuide();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeGuide();
  });

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400);
  }

  const heroImage = document.getElementById("heroImage");

  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    heroImage.addEventListener("mousemove", event => {
      const rect = heroImage.getBoundingClientRect();
      const rotateY = ((event.clientX - rect.left) / rect.width - 0.5) * 3;
      const rotateX = ((event.clientY - rect.top) / rect.height - 0.5) * -3;
      heroImage.style.transform =
        `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    heroImage.addEventListener("mouseleave", () => {
      heroImage.style.transform = "";
    });
  }

  document.getElementById("year").textContent = new Date().getFullYear();

  renderCategories();
  renderProducts();
</script>
